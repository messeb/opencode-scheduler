# Reusable: typecheck, unit tests, GUI build and GUI test on the supported Node versions.
name: Check

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:gui
      - run: npm run test:gui

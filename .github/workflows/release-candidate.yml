# Every push to release/x.y.z: check, then publish a release candidate x.y.z-rc.N as a GitHub pre-release
# (and to npm under the "next" tag when the NPM_TOKEN secret is set).
name: Release candidate

on:
  push:
    branches: ["release/*"]

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  candidate:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Version
        id: version
        run: |
          version=$(node scripts/release.mjs version "$GITHUB_REF_NAME")
          count=$(git tag --list "$version-rc.*" | wc -l)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rc=$version-rc.$((count + 1))" >> "$GITHUB_OUTPUT"
      - name: Pack
        env:
          RC: ${{ steps.version.outputs.rc }}
        run: |
          npm version "$RC" --no-git-tag-version
          npm pack
      - name: GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ steps.version.outputs.rc }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes=$(node scripts/release.mjs notes "$VERSION" 2>/dev/null || echo "Release candidate for $VERSION.")
          gh release create "$RC" ./*.tgz --target "$GITHUB_SHA" --prerelease --title "$RC" --notes "$notes"
      - name: npm (next)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish ./*.tgz --tag next --provenance --access public
